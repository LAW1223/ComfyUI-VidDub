[project]
name = "comfyui-viddub"
version = "0.1.0"
description = "ComfyUI custom node for the official VidDub inference pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Yexin Liu"}]
keywords = ["comfyui", "video-dubbing", "lip-sync", "viddub"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Repository = "https://github.com/LAW1223/ComfyUI-VidDub"
Issues = "https://github.com/LAW1223/ComfyUI-VidDub/issues"
VidDub = "https://github.com/LAW1223/VidDub"

[tool.comfy]
PublisherId = "law1223"
DisplayName = "ComfyUI-VidDub"
Icon = ""

[tool.ruff]
line-length = 100
